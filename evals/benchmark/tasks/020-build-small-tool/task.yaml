id: 020-build-small-tool
prompt: |
  Build a small command-line tool in wordfreq.py in the current directory. It must run as:

      python3 wordfreq.py <path> [--top N]

  It reads the text file at <path> and prints the most frequent words, one per line, as
  `word count` (the word, a single space, then its count). Requirements:

    - Counting is case-insensitive: `The`, `the` and `THE` are the same word.
    - Strip surrounding punctuation from each word, so `cat,` and `cat!` count as `cat`.
    - Split the text on whitespace to find words.
    - Print the top N words ordered by count descending; break ties by the word ascending
      (alphabetically). `--top` defaults to 10.

  There is a stub wordfreq.py to start from. Implement it so the tool behaves exactly as described.
max_steps: 30
difficulty: hard
tags:
  - python
  - cli
  - text
judges:
  - name: code_quality
    task_introduction: >-
      You are judging the code quality of a small word-frequency command-line tool (wordfreq.py) a
      developer was asked to build.
    evaluation_criteria: >-
      The code is high quality when wordfreq.py is clean, readable and idiomatic Python — clear names,
      sensible structure (tokenizing, counting and sorting factored readably), no dead code or obvious
      duplication. It is low quality when it is convoluted, copy-pasted, cryptically named, or hard to
      follow.
