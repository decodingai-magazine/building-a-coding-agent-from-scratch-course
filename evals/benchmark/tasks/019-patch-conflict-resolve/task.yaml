id: 019-patch-conflict-resolve
prompt: |
  The current directory has a module greet.py and a patch file feature.patch. The patch was written
  against an OLDER version of greet.py and no longer applies cleanly, because greet.py has since been
  changed independently: the greeting now capitalizes the name. The patch, meanwhile, rewords the
  greeting and adds punctuation.

  Apply the patch's change and resolve the conflict so BOTH intentions survive in greet.py: the
  existing capitalization of the name AND the patch's new wording and punctuation. Leave no conflict
  markers behind, and make sure the tests pass.
max_steps: 30
difficulty: hard
tags:
  - git
  - patch
  - merge
judges:
  - name: resolution_quality
    task_introduction: >-
      You are judging how well a conflict between feature.patch and the working tree was resolved in
      greet.py.
    evaluation_criteria: >-
      Score 1 if the resolved greet.py cleanly preserves BOTH intents — the working tree's
      capitalization of the name AND the patch's new greeting wording and punctuation — with no
      leftover conflict markers. Score 0 if either side's intent was dropped or any conflict marker
      remains.
