[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decode"
version = "0.1.0"
description = "A terminal coding agent (agentic harness) built from scratch, step by step — the artifact of the building-a-coding-agent-from-scratch course."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Paul Iusztin", email = "p.e.iusztin@gmail.com" },
]
keywords = ["coding-agent", "llm", "agent", "tui", "pydantic-ai", "mcp"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Runtime deps only. Dev/test go in [dependency-groups]. Kept light on purpose —
# the course adds the heavier integrations at the step that needs them.
dependencies = [
    "pydantic>=2.0,<2.13",  # capped <2.13 for kitaru→zenml (≤2.12.5); see ADR-0009
    "pydantic-settings>=2.4",
    "python-dotenv>=1",  # explicit .env-file parsing for pydantic-settings (env_file=".env")
    "click>=8.1,<8.3",  # capped <8.3 for kitaru→zenml (≤8.2.1); see ADR-0009
    "rich>=13",
    "prompt-toolkit>=3",
    # 1.x line for kitaru[pydantic-ai]; downgraded from 2.0 (ADR-0009). NOTE (task 058): switched from
    # the `pydantic-ai` meta package to `pydantic-ai-slim[google,openai]` and bumped the floor 1.89->1.95.
    # The meta package's all-provider extras (mistral/temporal/...) cap the resolver at 1.94.0, which
    # PRE-DATES `pydantic_ai.tools.AgentNativeTool` — a symbol kitaru 0.18's KitaruAgent adapter imports
    # at load. slim + only decode's two providers reaches 1.95 (adapter imports; full suite green) and
    # sheds ~40 transitive deps. Capped <1.96: 1.99+ re-breaks 51 agent-loop tests. NEEDS ADR-0009 amend.
    "pydantic-ai-slim[google,openai]>=1.95,<1.96",
    "httpx>=0.28.1",
    "markdownify>=1.2.2",
    "pyyaml>=6.0.3",
    "modal>=1.5.1",
    "anyio>=4.14.0",
    "kitaru[local,pydantic-ai,llm]>=0.18.0",  # durability runtime (ADR-0008); mcp extra dropped (conflicts pydantic-ai mcp)
]

# pydantic-ai (above) is the agent loop (ReAct) for src/decode/agent/; it pulls in
# google-genai (the Gemini LLM API) transitively, so both are now installed.
# Added as the course progresses — `uv add <pkg>` when you reach the step:
#   fastmcp        — MCP tool factory + servers     → src/decode/tools/, services/
#   opik           — observability / tracing        → src/decode/observability/
#   modal          — remote sandbox + model serving → src/decode/sandbox/, services/
#   kitaru         — durability runtime (confirm package name/source) → src/decode/runtime/

[project.scripts]
decode = "decode.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.12",
    "ruff>=0.15.20",
    "pre-commit>=4.6.0",
    "ty>=0.0.55",
]

[tool.hatch.build.targets.wheel]
packages = ["src/decode"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["generated_client"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade (PEP 585/604)
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length — the formatter owns this
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]    # assert is the whole point of tests
"scripts/**/*.py" = ["T201"]  # operator scripts may print

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# ``tests/support`` carries shared test-only helpers (e.g. the gated ``noop`` tool the
# permission/loop/e2e tests drive) that the shipped ``decode`` package must not contain.
pythonpath = ["src", "tests"]
filterwarnings = ["error"]
