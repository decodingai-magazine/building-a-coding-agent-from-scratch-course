[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decode"
version = "0.1.0"
description = "A terminal coding agent (agentic harness) built from scratch, step by step — the artifact of the building-a-coding-agent-from-scratch course."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Paul Iusztin", email = "p.e.iusztin@gmail.com" },
]
keywords = ["coding-agent", "llm", "agent", "tui", "pydantic-ai", "mcp"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Runtime deps only. Dev/test go in [dependency-groups]. Kept light on purpose —
# the course adds the heavier integrations at the step that needs them.
dependencies = [
    "pydantic>=2.0,<2.13",  # capped <2.13 for kitaru→zenml (≤2.12.5); see ADR-0009
    "pydantic-settings>=2.4",
    "python-dotenv>=1",  # explicit .env-file parsing for pydantic-settings (env_file=".env")
    "click>=8.1,<8.3",  # capped <8.3 for kitaru→zenml (≤8.2.1); see ADR-0009
    "rich>=13",
    "prompt-toolkit>=3.0.53",
    # 1.x line for kitaru[pydantic-ai]; downgraded from 2.0 (ADR-0009). NOTE (task 058): switched from
    # the `pydantic-ai` meta package to `pydantic-ai-slim[google,openai]` and bumped the floor 1.89->1.95.
    # The meta package's all-provider extras (mistral/temporal/...) cap the resolver at 1.94.0, which
    # PRE-DATES `pydantic_ai.tools.AgentNativeTool` — a symbol kitaru 0.18's KitaruAgent adapter imports
    # at load. slim + only decode's two providers reaches 1.95 (adapter imports; full suite green) and
    # sheds ~40 transitive deps. Capped <1.96: 1.99+ re-breaks 51 agent-loop tests.
    "pydantic-ai-slim[google,openai]>=1.95,<1.96",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "pyyaml>=6.0.3",
    "modal>=1.5.3",
    "anyio>=4.14.1",
    "kitaru[local,pydantic-ai,llm]>=0.18.0",  # durability runtime (ADR-0008); mcp extra dropped (conflicts pydantic-ai mcp)
    "logfire>=4.37.0",
]

[project.scripts]
decode = "decode.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.12",
    "ruff>=0.15.21",
    "pre-commit>=4.6.0",
    "ty>=0.0.63",
    "opik>=2.2.9",  # eval harness (ADR-0017); dev group — evals is not shipped in the wheel
    # litellm is opik's transitive judge backend; pinned <1.78 because 1.92+ (what opik 2.x pulls)
    # ships a Rust bridge that needs rustc >=1.86 to build from sdist. 1.77.x is pure-python wheels,
    # so `uv sync` / `make ci` build everywhere without a Rust toolchain. Lift once opik 2.0 Test
    # Suites are needed (ADR-0017 §6) and the build env has rustc >=1.86.
    "litellm<1.98",
]
remote = [
    "gcsfs!=2025.5.0,!=2025.5.0.post1,<=2026.7.0",
    "google-cloud-aiplatform>=1.162.0",
    "google-cloud-artifact-registry>=1.11.3",
    "google-cloud-build>=3.11.0",
    "google-cloud-container>=2.21.0",
    "google-cloud-logging>=3.8.0",
    "google-cloud-pipeline-components>=2.19.0",
    "google-cloud-run>=0.10.0",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-storage>=2.9.0",
    "grpcio!=1.68.*,!=1.69.*,!=1.70.*",
    "kfp>=2.6.0",
    "kubernetes>=30.1.0",
    "urllib3<2.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/decode"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["generated_client"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade (PEP 585/604)
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length — the formatter owns this
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# ``tests/support`` carries shared test-only helpers (e.g. the gated ``noop`` tool the
# permission/loop/e2e tests drive) that the shipped ``decode`` package must not contain. ``.`` puts the
# repo root on the path so the unit tests can import the operator scripts in ``scripts/`` (unpackaged).
pythonpath = ["src", "tests", "."]
filterwarnings = ["error"]
